<!doctype html>
<html lang="ko" data-page="login">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Google Calendar를 바탕으로 모두의 최적 회의 시간을 찾는 feet"
    />
    <title>feet | 로그인</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="login-title">
        <header class="brand" aria-label="feet">
          <div class="brand__logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <rect x="5" y="7" width="22" height="20" rx="5" />
              <path d="M10 5v5M22 5v5M5 13h22" />
              <path d="m11.5 20 3 3 6-7" />
            </svg>
          </div>
          <span class="brand__name">feet</span>
        </header>

        <div class="login-card__intro">
          <h1 id="login-title">모두의 시간을 더 쉽게</h1>
          <p>일정을 공유하지 않아도,<br class="mobile-break" /> 함께 가능한 시간을 찾을 수 있어요.</p>
        </div>

        <a class="google-button" href="./personal.html" aria-label="Google로 계속하기">
          <svg class="google-button__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3c1.9-1.8 2.9-4.4 2.9-7.5Z" />
            <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.3l-3.3-2.6c-.9.6-2.1 1-3.4 1a5.9 5.9 0 0 1-5.5-4.1H3.1v2.7A10 10 0 0 0 12 22Z" />
            <path fill="#FBBC05" d="M6.5 14a6 6 0 0 1 0-3.8V7.5H3.1a10 10 0 0 0 0 9.2L6.5 14Z" />
            <path fill="#EA4335" d="M12 6.1c1.5 0 2.8.5 3.9 1.5l2.9-2.9A9.8 9.8 0 0 0 3.1 7.5l3.4 2.7A5.9 5.9 0 0 1 12 6.1Z" />
          </svg>
          <span>Google로 계속하기</span>
        </a>

        <p class="privacy-note">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="10" width="14" height="10" rx="3" />
            <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" />
          </svg>
          <span>내 일정의 상세 내용은 다른 사람에게 공개되지 않아요.</span>
        </p>

        <footer class="login-card__footer" aria-label="정책 링크">
          <a href="#terms">이용약관</a>
          <span aria-hidden="true">·</span>
          <a href="#privacy">개인정보처리방침</a>
        </footer>
      </section>
    </main>
  </body>
</html>
